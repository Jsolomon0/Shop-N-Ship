<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Admin Demo | Shop N Ship</title><link rel="stylesheet" href="assets/styles.css" /></head>
